name: SpendWise CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "demo/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  # ------------------------------------------------------------------
  # 1. Quality gate: backend tests + frontend build
  # ------------------------------------------------------------------
  test:
    name: Test backend & build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest (fails the build on any test failure)
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ------------------------------------------------------------------
  # 2. Build -> Trivy scan -> push to GHCR (one matrix leg per image)
  # ------------------------------------------------------------------
  image:
    name: Build, scan & push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (GHCR requires lowercase)
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/spendwise-${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "${{ steps.meta.outputs.image }}" ./${{ matrix.service }}

      - name: Trivy scan (fail on HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              "${{ steps.meta.outputs.image }}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (tagged with commit SHA)
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.meta.outputs.image }}"

  # ------------------------------------------------------------------
  # 3. GitOps: write the new SHA into the Helm values; ArgoCD syncs it
  # ------------------------------------------------------------------
  deploy:
    name: Update Helm image tag (GitOps)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump image tag in helm/spendwise/values.yaml
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          sed -i -E "s|^(\s*repository: ghcr.io/)[^/]+(/spendwise-)|\1${owner}\2|" helm/spendwise/values.yaml
          sed -i -E "s|^(\s*tag: ).*$|\1\"${GITHUB_SHA}\"|" helm/spendwise/values.yaml
          git diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/spendwise/values.yaml
          git commit -m "ci: deploy ${GITHUB_SHA::7} to Kubernetes via ArgoCD [skip ci]" || echo "No changes"
          git push
