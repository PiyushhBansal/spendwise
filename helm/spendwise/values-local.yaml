# Overrides for the local kind cluster (terraform/local), layered on values.yaml
postgres:
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard # kind's local-path provisioner

# CPU requests sized to real usage so the HPA measures sensible percentages
# (tiny requests made normal startup CPU look like ~900% and triggered scale-out)
backend:
  resources:
    requests: { cpu: 200m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }

frontend:
  resources:
    requests: { cpu: 100m, memory: 32Mi }
    limits: { cpu: 200m, memory: 96Mi }

hpa:
  targetCPUUtilizationPercentage: 80
