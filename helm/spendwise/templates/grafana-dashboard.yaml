{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up automatically by the kube-prometheus-stack Grafana sidecar (label grafana_dashboard=1)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spendwise.name" . }}-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "spendwise.labels" . | nindent 4 }}
data:
  spendwise.json: |-
{{ .Files.Get "dashboards/spendwise.json" | indent 4 }}
{{- end }}
